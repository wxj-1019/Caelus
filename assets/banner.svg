<?xml version="1.0" encoding="UTF-8"?>
<!-- Caelus banner v2（扁平化）：无渐变、无辉光、无粒子、无动画。
     仅用应用图标的几何语言（三环核心 + 闪电）+ 品牌靛蓝 + 排版。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <!-- 纯色底 + 1px 描边（扁平，无圆角渐变） -->
  <rect width="960" height="300" rx="20" fill="#101116"/>
  <rect width="960" height="300" rx="20" fill="none" stroke="#22242C" stroke-width="1"/>

  <!-- 三环核心（扁平几何，复刻应用图标） -->
  <g transform="translate(192,150)">
    <!-- 外虚线环 -->
    <circle r="84" fill="none" stroke="#262933" stroke-width="1.2" stroke-dasharray="3 7"/>
    <!-- 中双弧环：靛蓝 + 淡紫，180° 相位 -->
    <circle r="67" fill="none" stroke="#5E5CE6" stroke-width="3.5" stroke-dasharray="70 351" stroke-linecap="round"/>
    <circle r="67" fill="none" stroke="#7A78F0" stroke-width="3.5" stroke-dasharray="70 351" stroke-linecap="round" transform="rotate(180)"/>
    <!-- 内刻度环 -->
    <circle r="52" fill="none" stroke="#2E313B" stroke-width="2.5" stroke-dasharray="2 5"/>
    <!-- 中心盘 + 闪电 -->
    <circle r="44" fill="#16171D" stroke="#3A3D4C" stroke-width="1"/>
    <path d="M 6 -20 L -12 6 L -1 6 L -6 22 L 12 -4 L 1 -4 Z" fill="#5E5CE6"/>
  </g>

  <!-- 字标：纯色，宽字距 -->
  <text x="330" y="140" font-size="72" font-weight="800" letter-spacing="8" fill="#F4F4F7">CAELUS</text>
  <!-- 标语：主中文 + 副英文（三语 README 共用同一横幅） -->
  <text x="334" y="180" font-size="24" letter-spacing="3" fill="#B9BAC4">为游戏腾出天空</text>
  <text x="334" y="210" font-size="14" letter-spacing="2" fill="#6E7079">CLEAR SKIES FOR YOUR GAME · 纯本地 · 零上传 · 退出即还原</text>
  <!-- 分隔细线 -->
  <line x1="334" y1="230" x2="520" y2="230" stroke="#262833" stroke-width="1"/>
</svg>
